name: 问题反馈
description: 反馈聊天跟随、显示、统计或安装问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿上传真实聊天日志、账号文件或密钥。截图请先遮挡个人信息。
  - type: input
    id: versions
    attributes:
      label: 版本
      description: 状态条、Codex 桌面版、Windows 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期行为
      description: 说明实际发生的情况，以及你期望的行为。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 运行诊断
      description: 设置页的识别方式、连接与跟随状态；说明是否手动锁定、是否打开多个窗口。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可提供已遮挡个人信息的截图或 npm run diagnose 摘要。
